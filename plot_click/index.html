<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin:0; padding:0; background:transparent; }
  #stage { position:relative; width:100%; }
  #wrap { position:relative; width:100%; line-height:0; }
  #wrap img { width:100%; display:block; }
  /* transparent hit targets over each plotted point */
  #wrap i { position:absolute; width:20px; height:20px; margin:-10px 0 0 -10px;
            border-radius:50%; cursor:pointer; }
  #wrap i:hover { background:rgba(37,99,235,.16);
                  box-shadow:inset 0 0 0 1px rgba(37,99,235,.45); }
  #wrap i.sel { background:rgba(220,38,38,.22);
                box-shadow:inset 0 0 0 2px #dc2626; }
  /* tooltip on hover only — marked points keep just the ring, so several
     can be marked at once without a wall of labels */
  #wrap i:hover::after {
    content:attr(data-tip); position:absolute; left:50%; bottom:135%;
    transform:translateX(-50%); background:#0f172a; color:#fff;
    font-family:"Source Sans Pro","Segoe UI",sans-serif; font-size:11.5px;
    font-weight:500; line-height:1.35; padding:5px 9px; border-radius:6px;
    white-space:pre; z-index:30; pointer-events:none;
    box-shadow:0 2px 8px rgba(0,0,0,.28); }
  /* flip/clamp so the label can't be clipped by the iframe edges */
  #wrap i.b:hover::after { bottom:auto; top:135%; }
  #wrap i.l:hover::after { left:0; transform:none; }
  #wrap i.r:hover::after { left:auto; right:0; transform:none; }

  /* Overlays live inside the stage so they are reachable full screen:
     the full-screen control top-right, the marking controls bottom-centre. */
  #toolbar, #fs { position:absolute; z-index:40; display:flex; align-items:center;
                  font-family:"Source Sans Pro","Segoe UI",sans-serif;
                  opacity:0; transition:opacity .15s; }
  #stage:hover #toolbar, #stage:hover #fs { opacity:1; }
  /* While points are marked the controls must be reliably visible, so this
     state is immediate — never dependent on the fade completing. */
  #toolbar.on { opacity:1; transition:none; }
  #stage:fullscreen #fs { opacity:1; transition:none; }

  #fs { top:8px; right:8px; gap:6px; padding:4px 9px; cursor:pointer;
        font-size:11.5px; font-weight:500; color:#475569; line-height:1;
        background:rgba(255,255,255,.95); border:1px solid #e2e8f0;
        border-radius:6px; box-shadow:0 1px 4px rgba(15,23,42,.10); }
  #fs:hover { color:#0f172a; border-color:#cbd5e1; background:#fff; }

  #toolbar { bottom:10px; left:50%; transform:translateX(-50%); gap:6px; padding:4px 6px;
             background:rgba(255,255,255,.95); border:1px solid #e2e8f0;
             border-radius:8px; box-shadow:0 2px 10px rgba(15,23,42,.12); }
  #toolbar button { display:flex; align-items:center; gap:5px; padding:4px 9px;
                    cursor:pointer; font-size:11.5px; font-weight:500;
                    font-family:inherit; color:#475569; background:#fff;
                    border:1px solid #e2e8f0; border-radius:6px; line-height:1; }
  #toolbar button:hover { color:#0f172a; border-color:#cbd5e1; }
  #drop { color:#b91c1c !important; border-color:#fecaca !important; }
  #drop:hover { color:#fff !important; background:#dc2626 !important;
                border-color:#dc2626 !important; }
  #marklabel { font-size:11.5px; font-weight:600; color:#334155;
               padding-left:4px; white-space:nowrap; }
  .hide { display:none !important; }

  /* In full screen keep #wrap exactly the image's box, so the percentage-
     positioned hit targets stay aligned with the markers. */
  #stage:fullscreen { background:#fff; display:flex;
                      align-items:center; justify-content:center; }
  #stage:fullscreen #wrap { width:min(100vw, calc(100vh * var(--ar, 1.85))); }
  #stage:fullscreen #fs { opacity:1; }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap"></div>
  <button id="fs" type="button" aria-label="Toggle full screen">
    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/>
    </svg><span id="fslabel">Full screen</span>
  </button>
  <div id="toolbar">
    <span id="marklabel" class="hide"></span>
    <button id="drop" type="button" class="hide">Deselect</button>
    <button id="clearmarks" type="button" class="hide">Clear marks</button>
  </div>
</div>
<script>
  var stage = document.getElementById("stage");
  var wrap  = document.getElementById("wrap");
  var fsBtn = document.getElementById("fs");
  var fsLbl = document.getElementById("fslabel");
  var bar   = document.getElementById("toolbar");
  var mLbl  = document.getElementById("marklabel");
  var dropB = document.getElementById("drop");
  var clrB  = document.getElementById("clearmarks");

  function act(action) {
    // Date.now() keeps the value distinct so repeat actions still register.
    send({ type: "streamlit:setComponentValue",
           value: { action: action.action, sl: action.sl || null, n: Date.now() },
           dataType: "json" });
  }
  dropB.addEventListener("click", function () { act({ action: "drop" }); });
  clrB.addEventListener("click", function () { act({ action: "clear" }); });

  function send(msg) {
    msg.isStreamlitMessage = true;
    window.parent.postMessage(msg, "*");
  }

  // True for either route below. The second promotes the iframe element, in
  // which case this document is not itself full screen, so also compare the
  // viewport against the screen.
  function isFullscreen() {
    if (document.fullscreenElement) return true;
    var sw = screen.width || 0, sh = screen.height || 0;
    return sh > 0 && window.innerHeight >= sh * 0.9 && window.innerWidth >= sw * 0.9;
  }

  function setHeight() {
    // While full screen the element is promoted out of normal flow; reporting
    // that height would blow up the iframe in the page behind it.
    if (isFullscreen()) return;
    send({ type: "streamlit:setFrameHeight",
           height: Math.ceil(wrap.getBoundingClientRect().height) });
  }

  function promoteIframe() {
    // Same-origin fallback: fullscreen the iframe element from the parent.
    try {
      var fe = window.frameElement;
      if (fe && fe.requestFullscreen) fe.requestFullscreen();
    } catch (e) {}
  }

  fsBtn.addEventListener("click", function () {
    if (document.fullscreenElement) { document.exitFullscreen(); return; }
    try {
      if (window.parent.document.fullscreenElement) {
        window.parent.document.exitFullscreen(); return;
      }
    } catch (e) {}
    if (!stage.requestFullscreen) { promoteIframe(); return; }
    try {
      // requestFullscreen can reject *or* throw synchronously depending on
      // how the embedding page is configured, so handle both.
      var p = stage.requestFullscreen();
      if (p && p.catch) p.catch(promoteIframe);
    } catch (e) {
      promoteIframe();
    }
  });

  function onFsChange() {
    var on = isFullscreen();
    fsLbl.textContent = on ? "Exit full screen" : "Full screen";
    if (!on) setHeight();          // restore the in-page height on exit
  }
  document.addEventListener("fullscreenchange", onFsChange);
  try {                            // catches the promote-the-iframe route
    window.parent.document.addEventListener("fullscreenchange", onFsChange);
  } catch (e) {}

  function updateToolbar(n) {
    var on = n > 0;
    mLbl.textContent = on ? (n === 1 ? "1 point marked" : n + " points marked") : "";
    [mLbl, dropB, clrB].forEach(function (el) { el.classList.toggle("hide", !on); });
    dropB.textContent = on && n > 1 ? "Deselect " + n : "Deselect";
    // The bar now holds only the marking controls, so hide the whole pill
    // when nothing is marked — otherwise an empty one shows on hover.
    bar.classList.toggle("hide", !on);
    bar.classList.toggle("on", on);       // stays visible while marks exist
  }

  function render(args) {
    var pts = args.points || [];
    var selected = args.selected || [];   // list of marked Sl No values
    updateToolbar(selected.length);
    wrap.innerHTML = "";

    var img = document.createElement("img");
    img.onload = function () {
      // Aspect ratio drives the full-screen sizing above.
      if (img.naturalHeight) {
        wrap.style.setProperty("--ar", img.naturalWidth / img.naturalHeight);
      }
      setHeight();
    };
    img.src = args.img;
    wrap.appendChild(img);

    pts.forEach(function (p) {
      var i = document.createElement("i");
      i.style.left = p.left + "%";
      i.style.top = p.top + "%";
      var cls = [];
      if (p.top < 14) cls.push("b");        // label would clip at the top
      if (p.left < 12) cls.push("l");       // ...or at the left/right edge
      else if (p.left > 88) cls.push("r");
      if (selected.indexOf(p.sl) !== -1) cls.push("sel");
      i.className = cls.join(" ");
      i.setAttribute("data-tip", "Sl No " + p.sl + "  ·  (" + p.x + ", " + p.y + ")");
      i.addEventListener("click", function () { act({ action: "toggle", sl: p.sl }); });
      wrap.appendChild(i);
    });
    setHeight();
  }

  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "streamlit:render") render(e.data.args || {});
  });
  window.addEventListener("resize", setHeight);

  send({ type: "streamlit:componentReady", apiVersion: 1 });
</script>
</body>
</html>
